[project]
name = "booksy-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata",  # zoneinfo has no tz database on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["booksy_bot", "booksy_bot.api"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
